<div class="group bg-white border border-neutral-200 rounded-xl overflow-hidden shadow-sm hover:-translate-y-1 hover:shadow-md transition-all duration-300">

  <!-- Imagen -->
  <div class="relative aspect-video overflow-hidden">
    @if (hotel()?.imagenUrl) {
      <img [src]="hotel()!.imagenUrl!" [alt]="hotel()?.nombre"
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
    } @else {
      <div class="w-full h-full bg-gradient-to-br from-bosque-100 to-neutral-200 flex items-center justify-center">
        <svg class="w-10 h-10 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
      </div>
    }
    <!-- Badge departamento -->
    <div class="absolute top-3 left-3">
      <span class="bg-white/90 backdrop-blur-sm text-neutral-700 text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full">
        {{ hotel()?.departamento?.nombre }}
      </span>
    </div>
  </div>

  <!-- Contenido -->
  <div class="p-5">
    <h5 class="font-display text-lg font-semibold text-neutral-900 leading-snug mb-1">
      {{ hotel()?.nombre }}
    </h5>
    <p class="text-xs text-neutral-500 mb-4 flex items-center gap-1">
      <svg class="w-3 h-3 text-neutral-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
      </svg>
      {{ hotel()?.direccion }}
    </p>

    <div class="flex items-center justify-between pt-4 border-t border-neutral-100">
      <span class="text-[11px] text-neutral-400">
        {{ hotel()?.habitaciones?.length }} habitaciones
      </span>
      <button class="inline-flex items-center gap-1.5 rounded-lg bg-bosque-900 hover:bg-bosque-800 px-4 py-2 text-xs font-semibold text-white transition-all active:scale-95">
        Reservar
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

</div>
